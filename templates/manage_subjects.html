{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects - Discipline Webster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } .glass-nav { background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid #e2e8f0; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    {% include 'includes/navbar.html' %}
    
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Manage Subjects</h1>
                <p class="mt-1 text-sm text-gray-500">Add and manage school subjects</p>
            </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100">
                <form method="POST" class="flex flex-wrap gap-4 items-end">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="add_subject">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Subject Name</label>
                        <input type="text" name="name" required placeholder="e.g., Mathematics" class="px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Code</label>
                        <input type="text" name="code" placeholder="e.g., MATH" class="px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">Add Subject</button>
                </form>
            </div>
            <div class="divide-y divide-gray-100">
                {% for subject in subjects %}
                <div class="px-6 py-4 flex items-center justify-between hover:bg-gray-50">
                    <div>
                        <p class="font-medium text-gray-900">{{ subject.name }}</p>
                        <p class="text-sm text-gray-500">{{ subject.code }}</p>
                    </div>
                    <form method="POST" onsubmit="return confirm('Delete this subject?')">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="delete_subject">
                        <input type="hidden" name="subject_id" value="{{ subject.id }}">
                        <button type="submit" class="px-3 py-1 bg-red-50 text-red-600 rounded-lg text-xs hover:bg-red-100">Delete</button>
                    </form>
                </div>
                {% empty %}
                <div class="px-6 py-8 text-center text-gray-500">No subjects configured</div>
                {% endfor %}
            </div>
        </div>
    </main>
</body>
</html>
