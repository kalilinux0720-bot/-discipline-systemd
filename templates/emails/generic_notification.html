<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Notification</title></head>
<body style="font-family: Inter, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
    <div style="background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 1.5rem;">{{ school.name|default:"Discipline Webster" }}</h1>
        <p style="margin: 5px 0 0; opacity: 0.9;">Notification</p>
    </div>
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;">
        <h2 style="color: #1e293b;">{{ message|title }}</h2>
        <p style="color: #6b7280; line-height: 1.6;">{{ message }}</p>
    </div>
    <p style="text-align: center; color: #94a3b8; font-size: 0.875rem; margin-top: 20px;">Discipline Webster - School Management Platform</p>
</body>
</html>
