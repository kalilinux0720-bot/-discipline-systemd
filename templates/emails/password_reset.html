<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Password Reset</title></head>
<body style="font-family: Inter, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
    <div style="background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 1.5rem;">Password Reset</h1>
        <p style="margin: 5px 0 0; opacity: 0.9;">Discipline Management System</p>
    </div>
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;">
        <p>Hello {{ username }},</p>
        <p>Your password has been reset. Your new password is:</p>
        <div style="background: #f8fafc; border: 2px dashed #2563eb; border-radius: 8px; padding: 15px; text-align: center; margin: 15px 0;">
            <code style="font-size: 1.25rem; font-weight: bold; color: #2563eb;">{{ new_password }}</code>
        </div>
        <p>Please login and change your password immediately.</p>
        <a href="/login/" style="display: inline-block; background: #2563eb; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; margin-top: 10px;">Login Now</a>
    </div>
    <p style="text-align: center; color: #94a3b8; font-size: 0.875rem; margin-top: 20px;">Discipline Webster - School Management Platform</p>
</body>
</html>
