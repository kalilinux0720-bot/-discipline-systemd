<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Reward Earned</title></head>
<body style="font-family: Inter, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
    <div style="background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 1.5rem;">Reward Earned!</h1>
        <p style="margin: 5px 0 0; opacity: 0.9;">Congratulations!</p>
    </div>
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 10px;">&#127942;</div>
        <h2 style="color: #f59e0b;">{{ student_name }}</h2>
        <p style="color: #6b7280;">has earned the</p>
        <h3 style="color: #7c3aed; font-size: 1.25rem; margin: 10px 0;">{{ reward_name }}</h3>
        <p style="color: #6b7280;">reward!</p>
        <p style="margin-top: 20px; font-size: 0.875rem; color: #9ca3af;">{{ date }}</p>
    </div>
    <p style="text-align: center; color: #94a3b8; font-size: 0.875rem; margin-top: 20px;">Discipline Webster - School Management Platform</p>
</body>
</html>
